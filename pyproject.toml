[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis voice gateway backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.1",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pydantic>=2.14.1,<3",
    "python-dotenv>=1.2.4,<2",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
