services:
  control:
    image: jarvis-runtime:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # The control API has no TCP listener or external network access.
    network_mode: none
    command: ["uvicorn", "server.control:create_control_app", "--factory", "--uds", "/run/jarvis/control.sock", "--no-access-log", "--log-level", "warning"]
    volumes:
      - gateway_cache:/app/cache
      - ./:/app/deploy-config
      - type: bind
        source: /run/jarvis
        target: /run/jarvis
        bind:
          create_host_path: false
    restart: unless-stopped

  gateway:
    image: jarvis-runtime:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # Host networking so the gateway reaches the Hermes host gateway on 127.0.0.1:8642.
    # The image CMD binds uvicorn to 127.0.0.1:8000 only.
    network_mode: host
    env_file: .env
    environment:
      JARVIS_CONTROL_SOCKET: /run/jarvis/control.sock
    volumes:
      - hf_cache:/root/.cache/huggingface
      - gateway_cache:/app/cache
      - type: bind
        source: /run/jarvis
        target: /run/jarvis
        bind:
          create_host_path: false
    depends_on:
      - control
    restart: unless-stopped

  caddy:
    image: caddy:2
    network_mode: host # listens on 80/443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  hf_cache:
  gateway_cache:
  caddy_data:
  caddy_config:
